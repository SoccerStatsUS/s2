{% if svg %}
<figure class="chart timeline-chart">
<svg viewBox="0 0 {{ svg.width }} {{ svg.height }}" role="img" aria-label="{{ caption }}" data-row-h="{{ svg.row_h }}">
  {% for label in labels %}
  <line class="grid" x1="{{ label.x|floatformat:1 }}" x2="{{ label.x|floatformat:1 }}" y1="{{ label.grid_top }}" y2="{{ label.grid_bottom }}"/>
  <text class="season" data-season="{{ label.text }}" x="{{ label.x|floatformat:1 }}" y="{{ svg.label_y }}" text-anchor="middle">{{ label.text }}</text>
  {% endfor %}
  {% if shaded %}{% for head in heads %}<rect class="head" data-season="{{ head.name }}" x="{{ head.x|floatformat:1 }}" y="{{ svg.head_top }}" width="{{ head.width|floatformat:1 }}" height="{{ svg.head_h }}"><title>rank by {{ head.name }}</title></rect>{% endfor %}{% endif %}
  {% for mark in marks %}
  <g class="row" data-index="{{ forloop.counter0 }}">
  {% if mark.url %}<a href="{{ mark.url }}">{% endif %}<text class="label" x="{{ svg.label_x }}" y="{{ mark.label_y|floatformat:1 }}" text-anchor="end">{{ mark.name }}<title>{{ mark.title }}</title></text>{% if mark.url %}</a>{% endif %}
  {% for block in mark.blocks %}{% if block.url %}<a href="{{ block.url }}">{% endif %}<rect class="mark{% if block.band != None %} finish-{{ block.band }}{% elif shaded %} partial{% endif %}" data-season="{{ block.season }}"{% if block.place %} data-place="{{ block.place }}"{% endif %} x="{{ block.x|floatformat:1 }}" y="{{ block.y|floatformat:1 }}" width="{{ block.width|floatformat:1 }}" height="{{ svg.block_h }}" rx="2"{% if block.tip %} data-tip="{{ block.tip }}"{% endif %}>{% if not block.tip %}<title>{{ block.title }}</title>{% endif %}</rect>{% if block.url %}</a>{% endif %}{% endfor %}
  </g>
  {% endfor %}
</svg>
<figcaption>{{ caption }}. Ordered by last season, then by seasons played. A block marks a season the {{ one }} played; a row with gaps is a {{ one }} that left and came back.{% if shaded %} Where a final table is on record the block is shaded by the finish, dark green at the top of the table to pale red at the bottom, and shows the record on hover; an outlined block is a season with no final table on file. Select a season at the top to rank the {{ one }}s by how they finished it, and again to restore the order.{% endif %}</figcaption>
</figure>
{% endif %}
