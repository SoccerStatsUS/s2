{% if svg %}
<figure class="chart">
<svg viewBox="0 0 {{ svg.width }} {{ svg.height }}" role="img" aria-label="{{ caption }}">
  {% for b in bars %}
  <text class="label" x="{{ svg.label_x }}" y="{{ b.label_y|floatformat:1 }}" text-anchor="end">{{ b.name }}</text>
  {% if b.url %}<a href="{{ b.url }}">{% endif %}<path class="mark" d="{{ b.path }}"><title>{{ b.title }}</title></path>{% if b.url %}</a>{% endif %}
  {% if b.median %}<line class="median {{ b.median.css }}" x1="{{ b.median.x|floatformat:1 }}" x2="{{ b.median.x|floatformat:1 }}" y1="{{ b.median.y1|floatformat:1 }}" y2="{{ b.median.y2|floatformat:1 }}"/>{% endif %}
  <text class="value" x="{{ b.value_x|floatformat:1 }}" y="{{ b.label_y|floatformat:1 }}">{{ b.value }}</text>
  {% endfor %}
</svg>
<figcaption>{{ caption }}. The rule across each bar is that club's median home crowd: the further the bar runs past its rule, the more a few big games carried the average. Hover or focus a bar for its figures.</figcaption>
</figure>
{% endif %}
