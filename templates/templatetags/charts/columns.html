{% if svg %}
<figure class="chart">
<svg viewBox="0 0 {{ svg.width }} {{ svg.height }}" role="img" aria-label="{{ caption }}">
  {% for t in ticks %}
  <line class="grid" x1="{{ svg.left }}" x2="{{ svg.right_edge }}" y1="{{ t.y|floatformat:1 }}" y2="{{ t.y|floatformat:1 }}"/>
  <text x="{{ svg.left|add:"-8" }}" y="{{ t.y|floatformat:1 }}" dy="4" text-anchor="end">{{ t.text }}</text>
  {% endfor %}
  <line class="axis" x1="{{ svg.left }}" x2="{{ svg.right_edge }}" y1="{{ svg.base|floatformat:1 }}" y2="{{ svg.base|floatformat:1 }}"/>
  {% for c in columns %}
  {% if c.url %}<a href="{{ c.url }}">{% endif %}<path class="mark{% if c.partial %} partial{% endif %}" d="{{ c.path }}"><title>{{ c.title }}</title></path>{% if c.url %}</a>{% endif %}
  {% if c.median %}<line class="median {{ c.median.css }}" x1="{{ c.median.x1|floatformat:1 }}" x2="{{ c.median.x2|floatformat:1 }}" y1="{{ c.median.y|floatformat:1 }}" y2="{{ c.median.y|floatformat:1 }}"/>{% endif %}
  {% endfor %}
  {% for l in labels %}
  <text x="{{ l.x|floatformat:1 }}" y="{{ svg.label_y }}" text-anchor="middle">{{ l.text }}</text>
  {% endfor %}
</svg>
<figcaption>{{ caption }}.{% if any_partial %} Outlined columns are seasons with a crowd on record for fewer than half their games.{% endif %} The rule across each column is that season's median crowd: the further the column rises above its rule, the more a few big games carried the average. Hover or focus a column for its figures; the table below has every season.</figcaption>
</figure>
{% endif %}
