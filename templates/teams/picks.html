{% extends "base.html" %}

{% block content %}

<h1><a href="{% url 'team_detail' team.slug %}">{{ team }} draft picks</a></h1>

<ul id="tabs"></ul>

<div id="tab_wrapper">

  <div tab="picks">
    <h3>Draft picks</h3>
    {% include "templatetags/lists/draft.html" %}
  </div>

  {% comment %}
  <div tab="stats">
    {% include "templatetags/stats/career.html" %}
  </div>
  {% endcomment %}

</div>

{% endblock %}
