<!DOCTYPE html>
<html lang="en">

<head>
  <title>{% block title %}All-time American soccer statistics{% endblock %} | SoccerStats.us</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block metadescription %}American soccer statistics from 1866 to today{% endblock %}">

  <link rel="icon" type="image/svg+xml" href="{{ STATIC_URL }}favicon.svg">
  <link rel="stylesheet" href="{{ STATIC_URL }}css/style.css?v=34" media="screen">

  <script src="{{ STATIC_URL }}js/jquery-1.8.3.js"></script>
  <script src="{{ STATIC_URL }}js/jquery.tablesorter.min.js"></script>
  <script src="https://d3js.org/d3.v3.min.js"></script>
  <script src="{{ STATIC_URL }}js/custom.js?v=5"></script>

  {% block extrahead %}{% endblock %}
</head>

<body>

  <header id="site-header">
    <div class="header-inner">
      <div id="title">
        <a href="/" id="maintitle">SoccerStats<span id="tld">.us</span></a>
      </div>

      <nav id="nav">
        <div class="nav-drop">
          <a href="{% url 'competition_index' %}">competitions</a>
          <div class="nav-menu">
            <a title="American Soccer League, 1921&ndash;1933" href="{% url 'competition_detail' 'american-soccer-league-1921-1933' %}">ASL</a>
            <a title="North American Soccer League, 1968&ndash;1984" href="{% url 'competition_detail' 'north-american-soccer-league' %}">NASL</a>
            <a title="Major League Soccer" href="{% url 'competition_detail' 'major-league-soccer' %}">MLS</a>
            <a title="National Women's Soccer League" href="{% url 'competition_detail' 'national-womens-soccer-league' %}">NWSL</a>
            <a title="US Open Cup" href="{% url 'competition_detail' 'us-open-cup' %}">USOC</a>
            <a title="US Men's National Team" href="{% url 'team_detail' 'united-states' %}">USMNT</a>
          </div>
        </div>
        <a href="{% url 'team_index' %}">teams</a>
        <a href="{% url 'person_index' %}">players</a>
        <div class="nav-drop">
          <a href="{% url 'more_index' %}">more</a>
          <div class="nav-menu">
            <a href="{% url 'dates_index' %}">dates</a>
            <a href="{% url 'award_index' %}">awards</a>
            <a href="{% url 'drafts_index' %}">drafts</a>
            <a href="{% url 'country_index' %}">places</a>
            <a href="{% url 'source_index' %}">sources</a>
          </div>
        </div>
        <form id="nav-search" method="get" action="{% url 'search' %}">
          <input name="q" type="text" placeholder="Search players and teams" aria-label="Search players and teams">
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"/>
              <line x1="15.5" y1="15.5" x2="21" y2="21"/>
            </svg>
          </button>
        </form>
      </nav>
    </div>

  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer id="site-footer">
    <div class="footer-inner">
      <span class="footer-tag">SoccerStats.us &mdash; American soccer history, 1866&ndash;present</span>
      <nav class="footer-links">
        <a href="{% url 'about_index' %}">about</a>
        <a href="{% url 'source_index' %}">sources</a>
        <a href="{% url 'random_person_detail' %}">random player</a>
        <a href="mailto:chris@soccerstats.us?subject=SoccerStats.us%20error%20report&body={{ request.build_absolute_uri|urlencode:'' }}">report an error on this page</a>
      </nav>
    </div>
  </footer>

</body>

</html>
