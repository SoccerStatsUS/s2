<!DOCTYPE html>
<html lang="en">

<head>
  <title>{% block title %}All-time American soccer statistics{% endblock %} | SoccerStats.us</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block metadescription %}American soccer statistics from 1866 to today{% endblock %}">

  <link rel="stylesheet" href="{{ STATIC_URL }}css/style.css?v=2" media="screen">

  <script src="{{ STATIC_URL }}js/jquery-1.8.3.js"></script>
  <script src="{{ STATIC_URL }}js/jquery.tablesorter.min.js"></script>
  <script src="https://d3js.org/d3.v3.min.js"></script>
  <script src="{{ STATIC_URL }}js/custom.js"></script>

  {% block extrahead %}{% endblock %}
</head>

<body>

  <header id="site-header">
    <div class="header-inner">
      <div id="title">
        <a href="/" id="maintitle">SoccerStats.us</a>
        <span id="subtitle">open source soccer statistics</span>
      </div>

      <nav id="nav">
        <a href="{% url 'scoreboard_today' %}">scores</a>
        <a href="{% url 'team_index' %}">teams</a>
        <a href="{% url 'person_index' %}">players</a>
        <a href="{% url 'competition_index' %}">competitions</a>
        <a href="{% url 'about_index' %}">about</a>
        <form id="search_form" method="get" action="/search">
          <input id="id_q" name="q" type="text" placeholder="search">
        </form>
      </nav>
    </div>

    <nav id="league-bar">
      <a title="Major League Soccer" href="{% url 'competition_detail' 'major-league-soccer' %}">MLS</a>
      <a title="National Women's Soccer League" href="{% url 'competition_detail' 'national-womens-soccer-league' %}">NWSL</a>
      <a title="US Open Cup" href="{% url 'competition_detail' 'us-open-cup' %}">USOC</a>
      <a title="North American Soccer League (2011-)" href="{% url 'competition_detail' 'north-american-soccer-league-2011-' %}">NASL2</a>
      <a title="US Men's National Team" href="{% url 'team_detail' 'united-states' %}">USMNT</a>
      <a title="Liga MX" href="{% url 'competition_detail' 'liga-mx' %}">Mexico</a>
      <a title="North American Soccer League" href="{% url 'competition_detail' 'north-american-soccer-league' %}">NASL</a>
      <a title="American Soccer League (1921-1933)" href="{% url 'competition_detail' 'american-soccer-league-1921-1933' %}">ASL</a>
    </nav>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

</body>

</html>
