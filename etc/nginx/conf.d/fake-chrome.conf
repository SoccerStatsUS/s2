# A Chrome that sends no Accept-Language is not Chrome. Real Chrome puts the
# header on every request; the residential-proxy scraper never does. It is the
# only stable tell it has: one request per IP across ~95k IPs a day, so no
# network block reaches it, and it sends Sec-CH-UA and Sec-Fetch-Mode, so the
# usual "spoofed UA, no client hints" test passes it. On 2026-09-13 the split
# in fingerprint.log was ~2,700 requests claiming Chrome/145 without the
# header against 17 with it. Everything else in that no-language bucket was
# already 403 by network, or Google's own fetchers (UA ends in "gzip(gfe)").
#
# The lookahead spares crawlers that carry "Chrome/" in a compatible-style UA:
# Googlebot and bingbot send no Accept-Language either, and blocking search
# would cost more than the scraper does. $fake_chrome is applied with a
# server-level `if` in the soccerstats.us vhost, so it covers /static/ too.
map $http_accept_language $lang_missing {
    default 0;
    ""      1;
}

map "$lang_missing $http_user_agent" $fake_chrome {
    default 0;
    "~*^1 (?!.*(?:bot|crawl|spider|compatible;|gzip\(gfe\))).*chrome/" 1;
}
