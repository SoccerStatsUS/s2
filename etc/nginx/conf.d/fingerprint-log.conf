# Second access log carrying the headers that separate a real browser from a
# scripted client spoofing a browser UA. Real Chrome sends Sec-CH-UA and
# Sec-Fetch-Mode on every navigation; scrapers that only fake the UA string
# almost never do. On 2026-09-11/12 a scraper on residential proxies sent
# ~100k requests/day from ~95k IPs across 14,338 /16s, one request per IP,
# 83% claiming Chrome, no static assets, no usable referer — nothing an IP
# block can reach. It confirmed the tell, which was not the one expected: that
# scraper sends Sec-CH-UA but never Accept-Language. The block is in
# fake-chrome.conf. This log stays because it carries request timings, which
# is how a slow view or an overload shows up.
#
# http context, so it applies to every vhost in addition to (not instead of)
# the default access.log. logrotate already globs /var/log/nginx/*.log.
log_format fingerprint '$remote_addr [$time_local] "$request" $status '
                       '"$http_referer" "$http_user_agent" '
                       'chua="$http_sec_ch_ua" fetch="$http_sec_fetch_mode" '
                       'lang="$http_accept_language" '
                       'rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/fingerprint.log fingerprint;
