# Slow down AI crawlers (ClaudeBot was doing 56k req/day, GPTBot 28k).
# Empty map value = unlimited; matched UAs are limited per source IP.
map $http_user_agent $ai_bot {
    default "";
    ~*(ClaudeBot|Claude-Web|Claude-User|anthropic-ai|GPTBot|OAI-SearchBot|ChatGPT-User) $binary_remote_addr;
}
limit_req_zone $ai_bot zone=aibots:10m rate=10r/m;

# Amazonbot sends no referral traffic back and crawls from 400+ IPs, so a
# per-IP key is meaningless. Bucket every one of its IPs into one counter.
# robots.txt Disallows it outright; this is the enforcement if it ignores that.
# Amzn-SearchBot is a second Amazon crawler with a different UA string; it
# slipped past the Amazonbot-only match and sent 17,082 requests from 432 IPs
# on 2026-09-11/12, 13,409 of them full pages, so it shares the bucket.
map $http_user_agent $amazon_bot {
    default "";
    ~*(Amazonbot|Amzn-SearchBot) "amazonbot";
}
limit_req_zone $amazon_bot zone=amazonbot:1m rate=6r/m;

# Bytespider/TikTokSpider (ByteDance) crawls from 203 IPs, PetalBot (Huawei)
# from 54, so per-IP keys are as meaningless here as for Amazonbot — bucket
# each into one counter. On 2026-09-07 Bytespider sent 5,233 requests and
# PetalBot 5,706; both ran 6-7k/day the two days before. Neither sends
# referral traffic back.
map $http_user_agent $bytedance_bot {
    default "";
    ~*(Bytespider|TikTokSpider) "bytedance";
}
limit_req_zone $bytedance_bot zone=bytedance:1m rate=6r/m;

map $http_user_agent $petal_bot {
    default "";
    ~*PetalBot "petalbot";
}
limit_req_zone $petal_bot zone=petalbot:1m rate=6r/m;
