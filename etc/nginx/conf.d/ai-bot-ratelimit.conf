# Slow down AI crawlers (ClaudeBot was doing 56k req/day, GPTBot 28k).
# Empty map value = unlimited; matched UAs are limited per source IP.
map $http_user_agent $ai_bot {
    default "";
    ~*(ClaudeBot|Claude-Web|Claude-User|anthropic-ai|GPTBot|OAI-SearchBot|ChatGPT-User) $binary_remote_addr;
}
limit_req_zone $ai_bot zone=aibots:10m rate=10r/m;
