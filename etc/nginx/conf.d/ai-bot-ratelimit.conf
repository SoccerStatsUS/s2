# Slow down AI crawlers (ClaudeBot was doing 56k req/day, GPTBot 28k).
# ExaSearchBot (Exa AI search, ~250 IPs) joined 2026-09-19 at ~3k/day.
# Empty map value = unlimited; matched UAs are limited per source IP.
map $http_user_agent $ai_bot {
    default "";
    ~*(ClaudeBot|Claude-Web|Claude-User|anthropic-ai|GPTBot|OAI-SearchBot|ChatGPT-User|ExaSearchBot) $binary_remote_addr;
}
limit_req_zone $ai_bot zone=aibots:10m rate=10r/m;

# Amazonbot sends no referral traffic back and crawls from 400+ IPs, so a
# per-IP key is meaningless. Bucket every one of its IPs into one counter.
# robots.txt Disallows it outright; this is the enforcement if it ignores that.
# Amzn-SearchBot is a second Amazon crawler with a different UA string; it
# slipped past the Amazonbot-only match and sent 17,082 requests from 432 IPs
# on 2026-09-11/12, 13,409 of them full pages, so it shares the bucket.
map $http_user_agent $amazon_bot {
    default "";
    ~*(Amazonbot|Amzn-SearchBot) "amazonbot";
}
limit_req_zone $amazon_bot zone=amazonbot:1m rate=6r/m;

# Bytespider/TikTokSpider (ByteDance) crawls from 203 IPs, PetalBot (Huawei)
# from 54, so per-IP keys are as meaningless here as for Amazonbot — bucket
# each into one counter. On 2026-09-07 Bytespider sent 5,233 requests and
# PetalBot 5,706; both ran 6-7k/day the two days before. Neither sends
# referral traffic back.
map $http_user_agent $bytedance_bot {
    default "";
    ~*(Bytespider|TikTokSpider) "bytedance";
}
limit_req_zone $bytedance_bot zone=bytedance:1m rate=6r/m;

map $http_user_agent $petal_bot {
    default "";
    ~*PetalBot "petalbot";
}
limit_req_zone $petal_bot zone=petalbot:1m rate=6r/m;

# ShapBot: unknown operator, ten Google Cloud IPs, 56-98k requests/day on
# 2026-09-16..19 — half HEADs of slashless URLs (301, nginx only), half GETs
# that reached gunicorn, 22-39k renders/day, the largest single consumer of
# it. It skips /games/, so it reads robots.txt; the Disallow there is the
# ask and this is the enforcement. Few IPs, but bucketed to match the others.
map $http_user_agent $shap_bot {
    default "";
    ~*ShapBot "shapbot";
}
limit_req_zone $shap_bot zone=shapbot:1m rate=6r/m;

# meta-externalagent (Meta AI training) crawls from ~150 IPs in 57.141.0.0/16:
# 11-68k requests/day on 2026-09-16..19, 7.7k in its peak hour, mostly
# /games/ pages, so it ignores the wildcard Disallow. Meta documents that it
# honours a named entry; robots.txt now has one.
map $http_user_agent $meta_bot {
    default "";
    ~*meta-externalagent "metabot";
}
limit_req_zone $meta_bot zone=metabot:1m rate=6r/m;

# SEO crawlers send no visitors back. DataForSeoBot ran 7k/day from one IP,
# AhrefsBot 5.5k, MJ12bot appeared 2026-09-20. All Disallowed in robots.txt.
map $http_user_agent $seo_bot {
    default "";
    ~*(DataForSeoBot|AhrefsBot|MJ12bot) "seobot";
}
limit_req_zone $seo_bot zone=seobot:1m rate=6r/m;

# PerplexityBot crawls from eight IPs in 18.97.9.96/29 (on Perplexity's
# published list, so genuine): 52k requests on 2026-09-20 and 32k on the 21st,
# 94% of them rendered by gunicorn, mostly /dates/ pages, and 7.6k client
# aborts on the 20th alone. Per-IP limiting would still allow ~115k/day, so it
# is bucketed. Perplexity-User (fetches a person asked for) is left alone.
map $http_user_agent $perplexity_bot {
    default "";
    ~*PerplexityBot "perplexity";
}
limit_req_zone $perplexity_bot zone=perplexity:1m rate=6r/m;

# Reflectionbot (reflection.ai) appeared 2026-09-20 from 73 IPs in
# 16.216.88.0/24: ~5k requests/day, nearly all rendered by gunicorn.
map $http_user_agent $reflection_bot {
    default "";
    ~*Reflectionbot "reflectionbot";
}
limit_req_zone $reflection_bot zone=reflectionbot:1m rate=6r/m;
