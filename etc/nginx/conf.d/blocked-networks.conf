# Networks blocked outright (403). http context, so this covers every vhost.
#
# 43.172.0.0/15 — ACEVILLE PTE.LTD. (SG). A scraper farm: on 2026-08-03 it sent
# 152,665 requests, 64% of the day's traffic, from 1,794 distinct IPs behind
# rotating fake desktop Chrome user-agents — up 7x from 21,600 the day before.
# It paces at ~4 req/IP/minute, well under any per-IP threshold worth setting,
# so the /15 is the smallest key that reaches it. It ignores robots.txt. No
# human traffic was observed from the range.
deny 43.172.0.0/15;

# 47.79.0.0/16, 47.82.0.0/16, 43.119.0.0/16 — Alibaba Cloud. One operator
# running two arms: 47.79 fetches HTML from 651 IPs behind rotating spoofed
# Chrome user-agents, and 47.82 + 43.119 fetch only style.css/custom.js with
# self-referers from 1,274 more IPs — a headless browser rendering what the
# first arm crawls. Combined 11,114 requests on 2026-09-07, peaking at 20,592
# the day before. 47.79 stamps a fabricated "https://www.google.com/" referer
# on 7,550 of its 7,643 requests; the giveaway is identical malformed URLs
# (/games/176303/%20Report%5D&quot%3B%7D — a link harvested out of an
# HTML-escaped JSON blob) replayed from two different IPs three seconds apart.
# Not one image or favicon was requested across all 11,114, so no browser ever
# loaded a whole page: no human traffic to lose. Like ACEVILLE it paces well
# under any per-IP threshold, so the /16 is the smallest key that reaches it.
# 43.119 is registered ASEPL-SG; 47.79 and 47.82 sit in Alibaba's ARIN AL-3
# block, which whois does not place in Singapore.
deny 47.79.0.0/16;
deny 47.82.0.0/16;
deny 43.119.0.0/16;

# 45.148.10.200 — a single host (RIPE/NL) probing for an exposed site backup:
# /1.zip, /backup-2.zip, /archive_3.zip, /4-backup.zip and so on. It sent 1,686
# requests on 2026-09-07 and every one of them 404'd, so there is nothing here
# to lose by dropping it. One IP, so no range is needed.
deny 45.148.10.200;
